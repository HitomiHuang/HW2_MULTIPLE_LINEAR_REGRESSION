name: Deploy Regression Lab

on:
  push:
    branches: [main]
    paths:
      - 'web/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Check site assets
        run: |
          test -s web/dist/index.html
          test -s web/dist/app.js
          test -s web/dist/worker.js
          test -s web/dist/analysis.py
          test -s web/dist/data/flood_sample.csv
          test -s web/dist/data/housing_sample.csv
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
